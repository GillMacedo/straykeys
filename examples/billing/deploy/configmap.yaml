apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
data:
  config.yaml: |
    listen: ":8080"
    database:
      url: postgres://db.staging:5432/billing
      max_open_conns: 20
      conn_timeout: 5
    retry:
      attempts: 5
      backoff: 500ms
    invoices:
      currancy: EUR
      due_days: 14
    shutdown_timeout: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
        - name: billing
          image: registry.example.com/billing:1.4.2
          args: ["--config", "/etc/billing/config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/billing
      volumes:
        - name: config
          configMap:
            name: billing-config
